name: Collect Instagram events

on:
  schedule:
    # 00:00, 08:00, 16:00 UTC. GitHub schedules are best-effort.
    - cron: "0 */8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: instagram-event-pipeline
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Restore pipeline caches and pending Apify run
        id: data
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data
          key: pipeline-apify-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-apify-v1-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Validate credentials
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS_B64: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_B64 }}
        shell: bash
        run: |
          for name in APIFY_TOKEN SUPABASE_URL SUPABASE_SERVICE_KEY GOOGLE_VISION_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Required Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          if [ -z "$GEMINI_API_KEY" ]; then
            if [ -z "$GOOGLE_CLOUD_PROJECT" ] || [ -z "$GOOGLE_APPLICATION_CREDENTIALS_B64" ]; then
              echo "Set GEMINI_API_KEY, or both GOOGLE_CLOUD_PROJECT and GOOGLE_APPLICATION_CREDENTIALS_B64" >&2
              exit 1
            fi
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_B64" | base64 --decode > "$RUNNER_TEMP/gcp.json"
            chmod 600 "$RUNNER_TEMP/gcp.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"
          fi

      - name: Run collection, OCR, assessment and publication
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_POSTS_PER_PROFILE: ${{ vars.APIFY_POSTS_PER_PROFILE || '100' }}
          APIFY_MAX_CHARGE_USD: ${{ vars.APIFY_MAX_CHARGE_USD || '10' }}
          # This ceiling is shared across all discovery batches.
          APIFY_TIMEOUT_SECONDS: '1800'
          APIFY_DISCOVERY_OVERLAP_SECONDS: ${{ vars.APIFY_DISCOVERY_OVERLAP_SECONDS || '300' }}
          APIFY_INCOMPLETE_RETRY_HOURS: ${{ vars.APIFY_INCOMPLETE_RETRY_HOURS || '24' }}
          PIPELINE_ACCOUNT_SOURCE: accounts_json
          # Historical imports are explicit local maintenance, never scheduled.
          PIPELINE_POST_BACKFILL_SINCE: ''
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: global
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/run.py

      # Save even when collection/extraction partially fails. The normal cache
      # action's success-only save would lose paid work and pending run IDs.
      - name: Save pipeline state
        if: always() && steps.data.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: pipeline/data
          key: pipeline-apify-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pipeline/data/last_run.json
            pipeline/data/apify_run.json
            pipeline/data/apify_plan.json
            pipeline/data/apify_runs/*.json
            pipeline/data/run.log
          if-no-files-found: ignore
          retention-days: 14
