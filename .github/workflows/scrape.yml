name: Collect Instagram events

on:
  schedule:
    # 00:00, 08:00, 16:00 UTC. GitHub schedules are best-effort.
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      migrate_plaintext_cache:
        description: "One-time migration of existing paid recovery state; delete old plaintext caches/artifacts after verifying the encrypted save"
        type: boolean
        default: false
      resume_halted:
        description: "Resume Apify batches halted by an abort or output contract failure (only after reviewing the cause)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read    # cache restore/save

concurrency:
  group: instagram-event-pipeline
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    if: github.repository == 'Highlander-Builders-Initiative/HighlanderHub' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements*.txt
            pipeline/constraints-security.txt

      - name: Restore encrypted pipeline state
        id: data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .pipeline-cache/state.enc
          key: pipeline-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-encrypted-v1-

      - name: Restore legacy state for an explicit one-time migration
        id: legacy
        if: inputs.migrate_plaintext_cache && steps.data.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: pipeline/data
          key: pipeline-apify-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-apify-v1-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Decrypt recovery state before any paid work
        id: state
        env:
          PIPELINE_CACHE_KEY: ${{ secrets.PIPELINE_CACHE_KEY }}
          MIGRATE_CACHE: ${{ inputs.migrate_plaintext_cache && 'true' || 'false' }}
          LEGACY_CACHE: ${{ steps.legacy.outputs.cache-matched-key }}
        run: |
          if [ -f .pipeline-cache/state.enc ]; then
            python pipeline/cache_state.py decrypt .pipeline-cache/state.enc
          elif [ "$MIGRATE_CACHE" = "true" ] && [ -n "$LEGACY_CACHE" ]; then
            # Validate the key and encrypt the existing paid recovery state.
            mkdir -p pipeline/data
            python pipeline/cache_state.py encrypt .pipeline-cache/state.enc
          else
            echo "No recovery state found. Migrate the legacy cache or recover pending paid runs before collection." >&2
            exit 1
          fi

      - name: Validate credentials
        if: '!inputs.migrate_plaintext_cache'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          GOOGLE_VISION_API_KEY_PRIMARY: ${{ secrets.GOOGLE_VISION_API_KEY_PRIMARY }}
          GOOGLE_VISION_API_KEY_SECONDARY: ${{ secrets.GOOGLE_VISION_API_KEY_SECONDARY }}
          GOOGLE_VISION_API_KEY_TERTIARY: ${{ secrets.GOOGLE_VISION_API_KEY_TERTIARY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS_B64: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_B64 }}
        shell: bash
        run: |
          for name in APIFY_TOKEN SUPABASE_URL SUPABASE_SERVICE_KEY GOOGLE_VISION_API_KEY GOOGLE_VISION_API_KEY_PRIMARY; do
            if [ -z "${!name}" ]; then
              echo "Required Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          vision_keys=()
          for name in GOOGLE_VISION_API_KEY_PRIMARY GOOGLE_VISION_API_KEY_SECONDARY GOOGLE_VISION_API_KEY_TERTIARY GOOGLE_VISION_API_KEY; do
            key="${!name}"
            if [ -z "$key" ]; then continue; fi
            for existing in "${vision_keys[@]}"; do
              if [ "$key" = "$existing" ]; then
                echo "All configured Vision keys must be different" >&2
                exit 1
              fi
            done
            vision_keys+=("$key")
          done
          if [ -z "$GEMINI_API_KEY" ]; then
            if [ -z "$GOOGLE_CLOUD_PROJECT" ] || [ -z "$GOOGLE_APPLICATION_CREDENTIALS_B64" ]; then
              echo "Set GEMINI_API_KEY, or both GOOGLE_CLOUD_PROJECT and GOOGLE_APPLICATION_CREDENTIALS_B64" >&2
              exit 1
            fi
            if ! python - "$RUNNER_TEMP/gcp.json" <<'PY'
          import base64
          import json
          import os
          import sys

          output_path = sys.argv[1]
          encoded = "".join(os.environ["GOOGLE_APPLICATION_CREDENTIALS_B64"].split())
          try:
              decoded = base64.b64decode(encoded + "=" * (-len(encoded) % 4), validate=True)
              credentials = json.loads(decoded)
          except (ValueError, json.JSONDecodeError):
              raise SystemExit(1)

          if not isinstance(credentials, dict) or credentials.get("type") != "service_account":
              raise SystemExit(1)

          with open(output_path, "wb") as output:
              output.write(decoded)
          PY
            then
              echo "GOOGLE_APPLICATION_CREDENTIALS_B64 must be base64 service-account JSON" >&2
              exit 1
            fi
            chmod 600 "$RUNNER_TEMP/gcp.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"
          fi

      - name: Run collection, OCR, assessment and publication
        if: '!inputs.migrate_plaintext_cache'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_POSTS_PER_PROFILE: ${{ vars.APIFY_POSTS_PER_PROFILE || '100' }}
          APIFY_MAX_CHARGE_USD: ${{ vars.APIFY_MAX_CHARGE_USD || '10' }}
          # This ceiling is shared across all discovery batches.
          APIFY_TIMEOUT_SECONDS: ${{ vars.APIFY_TIMEOUT_SECONDS || '3600' }}
          APIFY_DISCOVERY_OVERLAP_SECONDS: ${{ vars.APIFY_DISCOVERY_OVERLAP_SECONDS || '300' }}
          APIFY_INCOMPLETE_RETRY_HOURS: ${{ vars.APIFY_INCOMPLETE_RETRY_HOURS || '8' }}
          PIPELINE_ACCOUNT_SOURCE: accounts_json
          # Historical imports are explicit local maintenance, never scheduled.
          PIPELINE_POST_BACKFILL_SINCE: ''
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          GOOGLE_VISION_API_KEY_PRIMARY: ${{ secrets.GOOGLE_VISION_API_KEY_PRIMARY }}
          GOOGLE_VISION_API_KEY_SECONDARY: ${{ secrets.GOOGLE_VISION_API_KEY_SECONDARY }}
          GOOGLE_VISION_API_KEY_TERTIARY: ${{ secrets.GOOGLE_VISION_API_KEY_TERTIARY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: global
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESUME_HALTED: ${{ inputs.resume_halted && 'true' || 'false' }}
        run: |
          if [ "$RESUME_HALTED" = "true" ]; then
            python pipeline/run.py --resume-halted
          else
            python pipeline/run.py
          fi

      # Encrypt even when collection/extraction partially fails. The normal cache
      # action's success-only save would lose paid work and pending run IDs.
      - name: Encrypt pipeline state and diagnostics
        id: encrypted
        if: always() && steps.state.outcome == 'success'
        env:
          PIPELINE_CACHE_KEY: ${{ secrets.PIPELINE_CACHE_KEY }}
        run: python pipeline/cache_state.py encrypt .pipeline-cache/state.enc

      - name: Save encrypted pipeline state
        if: always() && steps.encrypted.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .pipeline-cache/state.enc
          key: pipeline-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload encrypted run diagnostics
        if: always() && steps.encrypted.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pipeline-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pipeline-cache/state.enc
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary service-account credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp.json"
