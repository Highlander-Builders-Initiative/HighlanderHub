name: App CI

# Lint, contract tests, production build, and Playwright e2e (fixture mode).
# Build uses placeholder Supabase env vars — no secrets required for PR checks.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  actions: read    # upload-artifact

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # next build imports src/lib/supabase.ts at compile time
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.ci-placeholder

jobs:
  lint-and-test:
    name: Lint & contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Contract tests stub modules with module.registerHooks (Node 22.15+).
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements*.txt
            pipeline/constraints-security.txt

      - name: Install importer integration dependencies
        run: pip install -r pipeline/requirements.txt -r pipeline/requirements-legacy.txt

      - name: Contract tests
        run: npm test

  pipeline:
    name: Pipeline unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements*.txt
            pipeline/constraints-security.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt -r pipeline/requirements-legacy.txt

      - name: Audit Python dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r pipeline/requirements.txt -r pipeline/requirements-legacy.txt

      - name: Pipeline unit tests
        working-directory: pipeline
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        env:
          CI: true
        run: npm run e2e

      # Retries record a trace (trace: "on-first-retry"); keep it so CI-only
      # failures can be opened with `npx playwright show-trace`.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
